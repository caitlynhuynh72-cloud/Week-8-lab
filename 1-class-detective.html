<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Detective</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!--
    CLASS DETECTIVE (nothing here is saved, so you cannot break it)
    Open DevTools (right-click, Inspect). Double-click a class="..." value to edit it.
    For each change: PREDICT first, then try it, then write what happened.

    1. Delete "container" from the first div.
    2. Change col-md-8 and col-md-4 to col-md-6 and col-md-6.
    3. Change p-4 to p-1, then p-5.
    4. Change bg-primary to bg-success, then bg-danger.
    5. Change col-md-8 to col-lg-8 and col-md-4 to col-lg-4, then resize the window.
    6. Remove g-4.
    7. Add text-center to the main box.
  -->
  <div class="container my-4">
    <h1 class="text-center mb-4">Class Detective</h1>
    <div class="row g-4">
      <div class="col-md-8">
        <div class="p-4 bg-primary text-white rounded-3">
          <h2>Main Column</h2>
          <p>This box takes 8 of 12 columns on screens 768px and wider.</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="p-4 bg-light border rounded-3">
          <h2 class="h4">Side Column</h2>
          <p class="mb-0">This box takes 4 of 12 columns.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
